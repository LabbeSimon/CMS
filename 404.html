<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page introuvable</title>
    <!--
        Page d'erreur de secours, servie directement par le serveur web
        quand PHP n'est pas dans la boucle (fichier refuse, erreur avant
        le CMS). Elle est volontairement autonome : styles en ligne,
        aucune requete vers un fichier externe, aucun script.

        Les 404 du CMS lui-meme sont rendues par index.php, avec l'en-tete
        et le pied du site, et peuvent etre reecrites par un plugin.
    -->
    <style>
        :root {
            --papier: #ffffff;
            --encre: #111111;
            --encre-douce: #666666;
            --accent: #e2001a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0 clamp(1.25rem, 5vw, 4rem) 4rem;
            max-width: 68rem;
            margin-inline: auto;

            font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
            font-size: 17px;
            line-height: 1.5;
            color: var(--encre);
            background: var(--papier);
        }

        .bande {
            height: 7px;
            margin: 0 calc(-1 * clamp(1.25rem, 5vw, 4rem));
            background:
                repeating-linear-gradient(135deg,
                    var(--accent) 0 12px,
                    transparent 12px 24px),
                var(--encre);
        }

        .code {
            margin: 4rem 0 0;
            font-size: clamp(4rem, 18vw, 11rem);
            font-weight: 700;
            line-height: 0.9;
            letter-spacing: -0.04em;
            color: var(--accent);
        }

        h1 {
            margin: 0.5rem 0 1.5rem;
            padding-top: 1rem;
            border-top: 4px solid var(--encre);

            font-size: clamp(1.75rem, 1.2rem + 2vw, 2.5rem);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -0.025em;
        }

        p { max-width: 34rem; }

        .discret { color: var(--encre-douce); font-size: 0.875rem; }

        a.bouton {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.6875rem 1.5rem;

            font-size: 0.8125rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            text-decoration: none;

            color: #ffffff;
            background: var(--encre);
            border: 1px solid var(--encre);
        }

        a.bouton:hover { background: var(--accent); border-color: var(--accent); }
    </style>
</head>
<body>
    <div class="bande"></div>

    <p class="code">404</p>

    <h1>Cette page n'existe pas</h1>

    <p>
        L'adresse demandée ne correspond à aucune page de ce site. Elle a peut-être été
        renommée ou supprimée, ou le lien qui vous a amené ici comporte une erreur.
    </p>

    <p><a class="bouton" href="/">Revenir à l'accueil</a></p>

    <p class="discret">Erreur 404</p>
</body>
</html>
