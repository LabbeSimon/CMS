<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice" role="img"
     aria-label="Illustration d'un centre-bourg français à colombages">
    <defs>
        <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#dce6f2"/>
            <stop offset="1" stop-color="#f3ece1"/>
        </linearGradient>
        <linearGradient id="eau" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8fa9c4"/>
            <stop offset="1" stop-color="#6d8aa8"/>
        </linearGradient>
    </defs>

    <rect width="1200" height="420" fill="url(#ciel)"/>

    <!-- Clocher -->
    <g fill="#4a5568">
        <rect x="252" y="150" width="76" height="150"/>
        <path d="M240 150 L290 60 L340 150 Z"/>
        <rect x="286" y="52" width="8" height="20"/>
        <rect x="278" y="60" width="24" height="6"/>
    </g>
    <g fill="#f3ece1">
        <rect x="270" y="180" width="16" height="34" rx="8"/>
        <rect x="294" y="180" width="16" height="34" rx="8"/>
    </g>

    <!-- Rangee de maisons a colombages -->
    <g>
        <rect x="60" y="210" width="150" height="90" fill="#efe3d0"/>
        <path d="M50 210 L135 155 L220 210 Z" fill="#a4433a"/>
        <g stroke="#6b4a35" stroke-width="5">
            <path d="M60 250 h150 M110 210 v90 M160 210 v90 M60 210 l50 40 M210 210 l-50 40"/>
        </g>

        <rect x="360" y="196" width="130" height="104" fill="#f6efe2"/>
        <path d="M350 196 L425 140 L500 196 Z" fill="#8f3b33"/>
        <g stroke="#6b4a35" stroke-width="5">
            <path d="M360 244 h130 M400 196 v104 M450 196 v104 M360 300 l40 -56 M490 300 l-40 -56"/>
        </g>

        <rect x="520" y="222" width="120" height="78" fill="#e8dcc8"/>
        <path d="M510 222 L580 170 L650 222 Z" fill="#a4433a"/>
        <g stroke="#6b4a35" stroke-width="4">
            <path d="M520 262 h120 M560 222 v78 M600 222 v78"/>
        </g>

        <rect x="680" y="204" width="140" height="96" fill="#f6efe2"/>
        <path d="M670 204 L750 148 L830 204 Z" fill="#8f3b33"/>
        <g stroke="#6b4a35" stroke-width="5">
            <path d="M680 250 h140 M730 204 v96 M780 204 v96 M680 204 l50 46 M820 204 l-50 46"/>
        </g>

        <rect x="860" y="216" width="150" height="84" fill="#efe3d0"/>
        <path d="M850 216 L935 162 L1020 216 Z" fill="#a4433a"/>
        <g stroke="#6b4a35" stroke-width="5">
            <path d="M860 256 h150 M910 216 v84 M960 216 v84"/>
        </g>

        <rect x="1050" y="230" width="120" height="70" fill="#f6efe2"/>
        <path d="M1040 230 L1110 180 L1180 230 Z" fill="#8f3b33"/>
        <g stroke="#6b4a35" stroke-width="4">
            <path d="M1050 266 h120 M1090 230 v70 M1130 230 v70"/>
        </g>
    </g>

    <!-- Fenetres -->
    <g fill="#3d4d63" opacity="0.75">
        <rect x="76" y="262" width="20" height="26"/><rect x="124" y="262" width="20" height="26"/>
        <rect x="376" y="256" width="20" height="30"/><rect x="424" y="256" width="20" height="30"/>
        <rect x="700" y="262" width="20" height="28"/><rect x="748" y="262" width="20" height="28"/>
        <rect x="880" y="268" width="20" height="26"/><rect x="928" y="268" width="20" height="26"/>
    </g>

    <!-- Quai et riviere -->
    <rect x="0" y="300" width="1200" height="18" fill="#cfc3ae"/>
    <rect x="0" y="318" width="1200" height="102" fill="url(#eau)"/>
    <g stroke="#ffffff" stroke-width="3" opacity="0.25">
        <path d="M60 350 h120 M240 372 h160 M480 344 h140 M700 380 h180 M940 352 h150"/>
    </g>

    <!-- Reflets des maisons -->
    <g opacity="0.18" fill="#8f3b33">
        <rect x="60" y="318" width="150" height="30"/>
        <rect x="360" y="318" width="130" height="34"/>
        <rect x="680" y="318" width="140" height="32"/>
        <rect x="860" y="318" width="150" height="28"/>
    </g>
</svg>
